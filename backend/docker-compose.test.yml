# Isolated, disposable database for pytest. It binds to loopback only and uses
# tmpfs so test records disappear when the container is stopped.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sme_swarm_test
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sme_swarm_test"]
      interval: 2s
      timeout: 3s
      retries: 30
